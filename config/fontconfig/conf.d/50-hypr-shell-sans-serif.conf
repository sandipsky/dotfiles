<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Make the generic sans-serif family resolve to Fira Sans (the desktop font,
  set for GTK in gtk-3.0/settings.ini and for hypr-shell in its config.json).

  This file is the install-time seed of the snippet hypr-shell-settings
  maintains: picking a font on its User interface page rewrites this exact
  path (src/settings/system_font.cpp in the hypr-shell repo) with the new
  family, so Qt apps follow the desktop font. Keep the filename in sync with
  system_font_fontconfig_path() there. It lives in conf.d rather than
  fontconfig/fonts.conf because fontconfig's 50-user.conf includes conf.d
  first, so an alias here beats one in a hand-written fonts.conf.

  This is how Qt apps get Fira Sans: without a Qt platform theme (deliberately
  none — see hypr/conf/environment.lua) Qt asks fontconfig for "Sans Serif" at
  9pt, and this alias answers with Fira Sans while the size stays 9pt. Setting
  QT_QPA_PLATFORMTHEME=gtk3 instead would take the GTK font wholesale, i.e.
  Fira Sans *12*, which combined with the global QT_SCALE_FACTOR=1.25 made Qt
  apps far too big.

  Also covers OBS, whose Yami theme hardcodes font-family 'Open Sans' (not
  installed) with sans-serif as the last fallback.

  Side effect: anything else asking for plain sans-serif (browser default
  fonts on pages without their own, GTK apps asking for "Sans") gets Fira Sans
  too instead of Noto Sans. serif and monospace are untouched.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Fira Sans</family></prefer>
  </alias>
</fontconfig>
